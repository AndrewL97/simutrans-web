<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20252b">
  <title>Simutrans Web</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #20252b; color: #f4f5f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { display:flex; align-items:center; gap:1rem; padding:.65rem 1rem; background:#15191e; }
    header h1 { font-size:1rem; margin:0; flex:1; }
    button { padding:.5rem .8rem; color:inherit; background:#343c45; border:1px solid #65717d; border-radius:.35rem; cursor:pointer; }
    #status { padding:.6rem 1rem; color:#c8d1da; font-size:.9rem; }
    #game-wrap { flex:1; min-height:0; display:grid; place-items:center; padding:.5rem; }
    canvas { display:block; max-width:100%; max-height:calc(100vh - 7rem); width:auto; height:auto; image-rendering:pixelated; outline:none; }
    #error { white-space:pre-wrap; color:#ffb4ab; padding:1rem; }
    footer { padding:.4rem 1rem; color:#aab4be; font-size:.75rem; }
  </style>
</head>
<body>
  <header>
    <h1>Simutrans WebAssembly</h1>
    <button id="fullscreen" type="button">Fullscreen</button>
  </header>
  <div id="status" role="status">Preparing browser filesystem…</div>
  <main id="game-wrap"><div id="error" hidden></div></main>
  <footer>Save data is local to this browser. Use a desktop browser for the best experience.</footer>

  <script>
    const status = document.querySelector("#status");
    const errorBox = document.querySelector("#error");
    const wrap = document.querySelector("#game-wrap");

    document.querySelector("#fullscreen").addEventListener("click", async () => {
      if (!document.fullscreenElement) await wrap.requestFullscreen?.();
      else await document.exitFullscreen?.();
    });

    // Emscripten's IDBFS persists files across page reloads. Mount before
    // main() and wait for the initial sync before allowing game startup.
    // The generated module must be built with -lidbfs.js and FS/IDBFS runtime
    // methods exported; the upstream build may need a custom HTML/JS launcher.
    var Module = {
      canvas: (() => {
        const canvas = document.createElement("canvas");
        canvas.id = "canvas";
        canvas.tabIndex = 0;
        wrap.appendChild(canvas);
        return canvas;
      })(),
      print: (text) => console.log(text),
      printErr: (text) => console.error(text),
      setStatus: (text) => { status.textContent = text || "Running"; },
      onAbort: (reason) => {
        errorBox.hidden = false;
        errorBox.textContent = "Simutrans stopped: " + reason;
      },
      preRun: [function () {
        try {
          if (!Module.FS.analyzePath("/persist").exists) Module.FS.mkdir("/persist");
          Module.FS.mount(Module.IDBFS, {}, "/persist");
          Module.addRunDependency("idbfs-ready");
          Module.FS.syncfs(true, (err) => {
            if (err) console.error("Could not restore browser saves", err);
            Module.removeRunDependency("idbfs-ready");
          });
        } catch (e) {
          console.warn("Persistent filesystem unavailable; saves may be temporary.", e);
        }
      }],
      postRun: [function () {
        status.textContent = "Game started";
        // A production port should call syncfs(false) after save writes or
        // use IDBFS autoPersist where supported by its Emscripten version.
      }],
      onRuntimeInitialized: () => { status.textContent = "WebAssembly initialized"; }
    };
  </script>
  <script>
    // The build step stages simutrans.js next to this file. Module must be
    // declared before loading it. This scaffold intentionally displays an
    // actionable error if the upstream port has not produced the expected file.
    const script = document.createElement("script");
    script.src = "./simutrans.js";
    script.onerror = () => {
      errorBox.hidden = false;
      errorBox.textContent =
        "The Simutrans WebAssembly runtime could not be loaded. Check the GitHub Actions build log and ensure simutrans.js and simutrans.wasm were generated.";
      status.textContent = "Runtime unavailable";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
