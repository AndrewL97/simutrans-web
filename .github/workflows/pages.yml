name: Build and deploy Simutrans WebAssembly

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout web wrapper
        uses: actions/checkout@v4

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes git curl unzip file

      - name: Verify toolchain
        shell: bash
        run: |
          emcc --version
          emcc --show-ports || true
          git --version
          unzip -v | head -n 2

      - name: Build Simutrans for the browser
        env:
          PAKSET_URL: ${{ vars.PAKSET_URL }}
          SOURCE_REPOSITORY: https://github.com/simutrans/simutrans.git
          SOURCE_REF: master
        run: bash scripts/build.sh

      - name: Download and install pak64
        shell: bash
        run: |
          set -euo pipefail

          PAK_URL="https://sourceforge.net/projects/simutrans/files/pak64/125-0/simupak64-125-0.zip/download"
          PAK_ZIP="$RUNNER_TEMP/simupak64-125-0.zip"
          PAK_DIR="$RUNNER_TEMP/pak64"

          curl --fail --location --retry 3 "$PAK_URL" -o "$PAK_ZIP"
          mkdir -p "$PAK_DIR"
          unzip -q "$PAK_ZIP" -d "$PAK_DIR"

          test -d "$PAK_DIR/simutrans/pak64"
          find "$PAK_DIR/simutrans/pak64" -name '*.pak' -print -quit | grep -q .

          mkdir -p dist/paksets
          mv "$PAK_DIR/simutrans/pak64" dist/paksets/pak64

      - name: Validate WebAssembly artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html
          test -s dist/sim.js
          test -s dist/sim.wasm
          ls dist
          file dist/sim.js dist/sim.wasm

          echo "WebAssembly artifacts are present."

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4  
        with:
          path: dist/
          retention-days: 30  

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Simutrans Web'

